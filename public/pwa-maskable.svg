<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="brandAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>
  <!-- Full Bleed Background for Maskable Icon -->
  <rect width="512" height="512" fill="#090A10" />
  
  <!-- Safe-zone centered emblem (80% circle safe zone) -->
  <g transform="translate(76.8, 76.8) scale(11.2)">
    <!-- Rounded Brand Base -->
    <rect x="1" y="1" width="30" height="30" rx="7" fill="url(#brandAmber)" />
    
    <!-- Film Reel Center -->
    <rect x="6" y="6" width="20" height="20" rx="3.5" fill="#090A10" />
    
    <!-- Film Sprockets Left -->
    <rect x="7.5" y="8" width="2" height="2" rx="0.5" fill="#FCD34D" />
    <rect x="7.5" y="12" width="2" height="2" rx="0.5" fill="#FCD34D" />
    <rect x="7.5" y="18" width="2" height="2" rx="0.5" fill="#FCD34D" />
    <rect x="7.5" y="22" width="2" height="2" rx="0.5" fill="#FCD34D" />

    <!-- Film Sprockets Right -->
    <rect x="22.5" y="8" width="2" height="2" rx="0.5" fill="#FCD34D" />
    <rect x="22.5" y="12" width="2" height="2" rx="0.5" fill="#FCD34D" />
    <rect x="22.5" y="18" width="2" height="2" rx="0.5" fill="#FCD34D" />
    <rect x="22.5" y="22" width="2" height="2" rx="0.5" fill="#FCD34D" />

    <!-- Center Film Frame Windows -->
    <rect x="11.5" y="8" width="9" height="6.5" rx="1" fill="#FCD34D" />
    <rect x="11.5" y="17.5" width="9" height="6.5" rx="1" fill="#FCD34D" />
  </g>
</svg>
